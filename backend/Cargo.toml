[package]
name = "backend"
version = "1.0.0"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.96"

categories = ["games"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/ShadowGuessr"

[lints]
workspace = true

[dependencies]
crossbeam = "0.8.4"
hex = "0.4.3"
log = "0.4.31"
thiserror = "2.0.18"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
