[package]
name = "frontend"
version = "1.0.0"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.96"

categories = ["games"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/ShadowGuessr"

[lints]
workspace = true

[dependencies]
backend = { path = "../backend" }

chrono = "0.4.44"
crossbeam = "0.8.4"
egui = "0.34.3"
egui-phosphor = "0.12.0"
eframe = { version = "0.34.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
fern = "0.7.1"
log = "0.4.31"
o2o = "0.5.4"
rand = "0.10.1"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
semver = "1.0.28"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
toml = "1.1.2"
walkers = "0.53.0"
